[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-scan"
version = "0.1.0"
description = "Offline reconstruction and measured floor-plan generation for Stray Scanner LiDAR captures."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary assessment submission" }
authors = [
  { name = "Assessment Candidate" },
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "open3d>=0.19,<0.21",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
cozmo-scan = "cozmo_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

