[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-scan"
version = "0.4.0"
description = "Offline reconstruction and measured floor-plan generation for Stray Scanner LiDAR captures."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  # Build backend, needed for the offline packaging audit. Not a runtime dependency.
  "setuptools>=75",
]

[project.scripts]
cozmo-scan = "cozmo_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
